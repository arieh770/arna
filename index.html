<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Catalogue de Vêtements</title>

    <!-- CSS (toujours dans le head) -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Mon Catalogue de Vêtements</h1>
        <p>Découvrez notre collection</p>

        <!-- AJOUT PANIER -->
        <div id="panier">
            🛒 Panier : <span id="compteur">0</span>
        </div>
    </header>

    <main>
        <section class="catalogue">

            <article class="produit">
                <img src="images/vetement1.jpg" alt="T-shirt Premium">
                <h2>T-shirt Premium</h2>
                <p>Description à compléter...</p>

                 <button class="ajout-panier">Ajouter au panier 🛒</button>
            </article>

            <article class="produit">
                <img src="images/vetement2.jpg" alt="Sweat Moderne">
                <h2>Sweat Moderne</h2>
                <p>Description à compléter...</p>

                 <button class="ajout-panier">Ajouter au panier 🛒</button>
            </article>

            <article class="produit">
                <img src="images/vetement3.jpg" alt="Veste Élégante">
                <h2>Veste Élégante</h2>
                <p>Description à compléter...</p>

                 <button class="ajout-panier">Ajouter au panier 🛒</button>
            </article>

        </section>
    </main>

    <footer>
        <p>© 2026 Mon Catalogue</p>
    </footer>

    <!-- JS (TOUJOURS en bas du body) -->
    <script src="script.js"></script>

</body>
</html>
